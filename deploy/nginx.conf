# Reverse proxy for Lipina. Put TLS in front (Caddy, Cloudflare, certbot) or add a 443 server block.
upstream lipina_app { server web:8000; }

server {
    listen 80;
    server_name _;
    client_max_body_size 250m;           # >= MAX_UPLOAD_MB
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "microphone=(self), camera=()" always;

    # Cover art is public & immutable (uuid file names).
    location /media/covers/ {
        alias /data/media/covers/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Audio is only reachable via X-Accel-Redirect from Django after the signed-URL check.
    location /protected-media/ {
        internal;
        alias /data/media/;
        add_header Accept-Ranges bytes;
        add_header Cache-Control "private, max-age=86400";
    }

    location /media/ { return 404; }

    location / {
        proxy_pass http://lipina_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300s;
        proxy_request_buffering off;    # stream large uploads
    }
}
