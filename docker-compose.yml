# Production-style stack: nginx → gunicorn/Django, Postgres, Redis, and a scheduler
# that refreshes radio stations daily and podcast feeds hourly.
#   cp backend/.env.example backend/.env   # then edit
#   docker compose up -d --build
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lipina
      POSTGRES_USER: lipina
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lipina}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lipina"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  web:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgres://lipina:${POSTGRES_PASSWORD:-lipina}@db:5432/lipina
      CACHE_URL: redis://redis:6379/1
      MEDIA_ROOT: /data/media
      USE_X_ACCEL_REDIRECT: "1"
    volumes: [media:/data/media]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    restart: unless-stopped

  scheduler:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgres://lipina:${POSTGRES_PASSWORD:-lipina}@db:5432/lipina
      CACHE_URL: redis://redis:6379/1
      RUN_MIGRATIONS: "0"
    command: >
      sh -c 'while true; do
        python manage.py refresh_podcasts || true;
        if [ "$$(date +%H)" = "03" ] || [ ! -f /tmp/radio-synced ]; then python manage.py sync_radio && touch /tmp/radio-synced || true; fi;
        sleep 3600;
      done'
    depends_on: [web]
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports: ["${HTTP_PORT:-80}:80"]
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media:/data/media:ro
    depends_on: [web]
    restart: unless-stopped

volumes:
  pgdata:
  media:
