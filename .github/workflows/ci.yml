name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_DB: lipina, POSTGRES_USER: lipina, POSTGRES_PASSWORD: lipina }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U lipina" --health-interval 5s --health-retries 10
    defaults:
      run: { working-directory: backend }
    env:
      DEBUG: "0"
      SECRET_KEY: ci-only-secret-key-0123456789abcdefghijklmnopqrstuvwxyz
      DATABASE_URL: postgres://lipina:lipina@localhost:5432/lipina
      ALLOWED_HOSTS: testserver,localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r requirements.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py check --deploy --fail-level ERROR
      - run: python manage.py collectstatic --noinput -v0
      - run: python manage.py test -v2

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Syntax-check web modules
        run: for f in backend/web/static/web/js/*.js backend/web/static/web/sw.js; do node --check "$f"; done

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: mobile }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter create --org za.lipina --project-name lipina --platforms android,ios .
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  docker:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t lipina-backend ./backend
