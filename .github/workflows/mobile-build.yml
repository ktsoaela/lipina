# Builds installable mobile apps. Run it from the Actions tab ("Run workflow") or push a v* tag.
#   android → lipina.apk (Android and Huawei phones; signed with the debug key, fine for sideloading)
#   ios     → lipina-unsigned.ipa (sign and install with your Apple ID via Sideloadly/AltStore,
#             or add signing secrets to ship through TestFlight)
name: mobile-build

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "Default Lipina server URL shown on the login screen"
        default: "https://music.example.com"
  push:
    tags: ["v*"]

env:
  LIPINA_API: ${{ inputs.api_url || 'https://music.example.com' }}

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: mobile }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter create --org za.lipina --project-name lipina --platforms android,ios .
      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release --dart-define=LIPINA_API="$LIPINA_API"
      - run: mv build/app/outputs/flutter-apk/app-release.apk lipina.apk
      - uses: actions/upload-artifact@v4
        with: { name: lipina-android, path: mobile/lipina.apk }

  ios:
    runs-on: macos-latest
    defaults:
      run: { working-directory: mobile }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter create --org za.lipina --project-name lipina --platforms android,ios .
      - name: iOS permissions (background audio, microphone, http radio streams)
        run: |
          P=ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" $P || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" $P
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'Lipina listens briefly to identify the song that is playing.'" $P
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" $P || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" $P
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes array" $P || true
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:0 string spotify" $P
          /usr/libexec/PlistBuddy -c "Add :io.flutter.embedded_views_preview bool true" $P
          sed -i '' "s/platform :ios, '[0-9.]*'/platform :ios, '13.0'/; s/^# platform :ios/platform :ios/" ios/Podfile || true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign --dart-define=LIPINA_API="$LIPINA_API"
      - name: Package unsigned .ipa
        run: |
          mkdir -p Payload && cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr lipina-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: lipina-ios-unsigned, path: mobile/lipina-unsigned.ipa }
